<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันครบรอบของเรา ⏳</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <section class="card wide center">
        <div class="chapter">OUR ANNIVERSARY</div>
        <h1>เวลาที่เรามีกันและกัน ❤️</h1>
        <p class="soft">ทุกวินาทีที่ผ่านมามีความหมายเสมอ</p>
        <div id="time-counter" class="counter-box">
          <div class="time-block">
            <span id="years">0</span>
            <small>ปี</small>
          </div>
          <div class="time-block">
            <span id="months">0</span>
            <small>เดือน</small>
          </div>
          <div class="time-block">
            <span id="days">0</span>
            <small>วัน</small>
          </div>
          <div class="time-block">
            <span id="hours">0</span>
            <small>ชั่วโมง</small>
          </div>
          <div class="time-block">
            <span id="minutes">0</span>
            <small>นาที</small>
          </div>
          <div class="time-block">
            <span id="seconds">0</span>
            <small>วินาที</small>
          </div>
        </div>
        <div class="back">
          <a class="btn" href="menu.html">← กลับเมนู</a>
        </div>
      </section>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
